name = "train-air-collections"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Access identity (used to validate the Access JWT in auth.ts)
[vars]
TEAM_NAME = "divine-boat-89b2"
POLICY_AUD = "11185823e217889d7aa18a5569d593402f66ec317802c991fb05e013e26b0822"

# Static frontend (built from ../client/dist via `npm run assets`)
[assets]
directory = "./assets"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "train-air-db"
# Run `wrangler d1 create train-air-db` and paste the real database_id here
database_id = "e7de4600-9520-4d63-b87b-90a73f34fd48"

[[r2_buckets]]
binding = "R2"
bucket_name = "train-air"

# Daily auto-backup of user data to R2 (see src/scheduled.ts)
[triggers]
crons = ["17 3 * * *"]